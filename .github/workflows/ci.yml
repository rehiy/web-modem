name: CI

on:
  push:
    branches: [master, gh-master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Build UI
        working-directory: webui
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile
          corepack pnpm lint
          corepack pnpm build
      - name: Check Go
        env:
          CGO_ENABLED: 1
        run: |
          go test -race ./...
          go vet ./...
