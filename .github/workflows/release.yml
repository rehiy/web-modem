name: Release Builder

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      UPDATE_REPO: ${{ github.repository }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Prepare pnpm
        run: corepack enable

      - name: Build binary
        run: |
          sh build.sh

      - name: Verify
        run: |
          (cd webui && corepack pnpm lint)
          go test ./...
          go vet ./...

      - name: Create github release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          body_path: ./RELEASE.md
          draft: false
          prerelease: false
          files: |
            ./build/*
